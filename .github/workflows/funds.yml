name: 更新基金淨值

on:
  schedule:
    - cron: '17 13 * * 1-6'   # 21:17（台灣時間）：投信公會、集保多半傍晚公布前一個營業日淨值
    - cron: '47 1 * * 1-6'    # 09:47 再補一次
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_funds.py
      - .github/workflows/funds.yml

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 境內＋境外基金
        timeout-minutes: 10
        run: python scripts/build_funds.py
      - name: 提交資料
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/funds
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -m "chore: 更新基金淨值 $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
