name: 探測基金資料來源（暫時）
on:
  push:
    branches: [main]
    paths: [scripts/probe_funds.py, .github/workflows/probe.yml]
permissions:
  contents: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe_funds.py || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe; git commit -m "chore: 探測基金資料" || exit 0
          git pull --rebase origin main; git push
